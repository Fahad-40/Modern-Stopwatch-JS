<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Stopwatch</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Stopwatch</h1>

            <div class="time">
                <span id="hr">00</span>
                <span>:</span>
                <span id="min">00</span>
                <span>:</span>
                <span id="sec">00</span>
                <span class="dot">.</span>
                <span class="ms" id="count">00</span>

            </div>

            <div class="buttons">
                <button id="start" class="btn start">Start</button>
                <button id="stop" class="btn stop">Stop</button>
                <button id="reset" class="btn reset">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
